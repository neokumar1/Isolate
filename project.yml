name: Isolate
options:
  bundleIdPrefix: com.isolate
  deploymentTarget:
    macOS: "14.0"
targets:
  Isolate:
    type: application
    platform: macOS
    sources: 
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: com.isolate.Isolate
        CFBundleName: Isolate
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "1.3.0"
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "Copyright © 2026 Neo Kumar. MIT License."
        NSHighResolutionCapable: true
        ATSApplicationFontsPath: "."
        # Imported songs stay where they are; later launches reread them for
        # artwork, tags and stem rebuilds, which macOS gates per location.
        NSDesktopFolderUsageDescription: Isolate reads songs you imported from your Desktop folder to show their details and rebuild their stems.
        NSDocumentsFolderUsageDescription: Isolate reads songs you imported from your Documents folder to show their details and rebuild their stems.
        NSDownloadsFolderUsageDescription: Isolate reads songs you imported from your Downloads folder to show their details and rebuild their stems.
        NSRemovableVolumesUsageDescription: Isolate reads songs you imported from external drives to show their details and rebuild their stems.
        NSNetworkVolumesUsageDescription: Isolate reads songs you imported from network drives to show their details and rebuild their stems.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: 5.0
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        APP_INTENTS_METADATA_EXTRACTION_ENABLED: NO
        GENERATE_INFOPLIST_FILE: NO
  IsolateTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests/IsolateTests
    dependencies:
      - target: Isolate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  IsolateUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: UITests/IsolateUITests
    dependencies:
      - target: Isolate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

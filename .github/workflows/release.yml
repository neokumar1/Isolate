name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release DMG
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Package Release DMG & ZIP
        run: |
          bash scripts/package_release.sh ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Isolate.dmg
            dist/Isolate-${{ github.ref_name }}.dmg
            dist/Isolate-${{ github.ref_name }}-macOS.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ### ⚡ Isolate: 4-Stem Neural Audio Isolation
            
            #### 📦 Installation:
            1. Download and open **`Isolate.dmg`**.
            2. Drag **`Isolate.app`** into **`Applications`**.
            
            > [!IMPORTANT]
            > **First-Launch Gatekeeper Note**:
            > Because Isolate is an independent open-source app, macOS Gatekeeper may show a security notice on first launch.
            > - **Option 1**: Right-click (or Control-click) `Isolate.app` in Applications → click **Open** → click **Open**.
            > - **Option 2**: In Terminal, run: `xattr -cr /Applications/Isolate.app`

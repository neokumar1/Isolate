name: Bug report
description: Something in Isolate doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. If macOS won't open Isolate, see [First launch](https://github.com/neokumar1/Isolate#first-launch); many other problems are covered in [Troubleshooting](https://github.com/neokumar1/Isolate/blob/main/TROUBLESHOOTING.md).
  - type: input
    id: version
    attributes:
      label: Isolate version
      description: Shown in About Isolate.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.6, MacBook Air M2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps that lead to the problem.
      placeholder: |
        1. Imported a 4-minute FLAC file with ⌘O
        2. ...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact message Isolate showed, if any.
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio file details
      description: Format, sample rate, channels and length, if the problem involves a song. Please don't attach copyrighted or private audio.
      placeholder: "FLAC, 48 kHz, stereo, 4:05"
